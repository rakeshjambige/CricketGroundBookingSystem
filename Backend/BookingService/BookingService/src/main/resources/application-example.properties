spring.application.name=BookingService

server.port=8081

# Database Configurations

spring.datasource.url=jdbc:mysql://localhost:3306/cricketbookingsystem
spring.datasource.username=YOUR_DATABASE_USERNAME
spring.datasource.password=YOUR_DATABASE_PASSWORD
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Kafka Broker

spring.kafka.bootstrap-servers=localhost:9092

# Consumer Config

spring.kafka.consumer.group-id=booking-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=com.vcube.BookingService.dto
spring.kafka.consumer.properties.spring.json.value.default.type=com.vcube.BookingService.dto.BookingRequestDto

# Producer Config

spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

# Kafka Topic Creation

spring.kafka.admin.auto-create=true